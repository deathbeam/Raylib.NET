name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-and-update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release -p:SkipNatives=true

      - name: Test
        run: dotnet test -p:SkipNatives=true -p:SkipGen=true

      - name: Push Changes
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          if [ -n "$(git status --porcelain)" ]; then
             git add .
             git commit -m "Update bindings [ci skip]"
             git push
          else
             echo "No changes to commit"
          fi

  natives:
    strategy:
      matrix:
        include:
          - runtime: linux-x64
            config: Debug
            os: ubuntu-latest
          - runtime: linux-x64
            config: Release
            os: ubuntu-latest
          - runtime: linux-x86
            config: Debug
            os: ubuntu-latest
          - runtime: linux-x86
            config: Release
            os: ubuntu-latest
          - runtime: linux-arm64
            config: Debug
            os: ubuntu-latest
          - runtime: linux-arm64
            config: Release
            os: ubuntu-latest
          - runtime: browser-wasm
            config: Debug
            os: ubuntu-latest
          - runtime: browser-wasm
            config: Release
            os: ubuntu-latest
          - runtime: osx-x64
            config: Debug
            os: macos-15
          - runtime: osx-x64
            config: Release
            os: macos-15
          - runtime: osx-arm64
            config: Debug
            os: macos-15
          - runtime: osx-arm64
            config: Release
            os: macos-15
          - runtime: win-x64
            config: Debug
            os: windows-latest
          - runtime: win-x64
            config: Release
            os: windows-latest
          - runtime: win-x86
            config: Debug
            os: windows-latest
          - runtime: win-x86
            config: Release
            os: windows-latest
          - runtime: win-arm64
            config: Debug
            os: windows-latest
          - runtime: win-arm64
            config: Release
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Environment (Linux)
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev

      - name: Setup EMSDK
        if: matrix.runtime == 'browser-wasm'
        uses: mymindstorm/setup-emsdk@v14
        with:
          actions-cache-folder: 'emsdk-cache'

      - name: Build Natives
        run: dotnet build -c ${{ matrix.config }} -r ${{ matrix.runtime }}
        working-directory: src/Raylib.NET.Native

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.config }}-${{ matrix.runtime }}
          path: src/Raylib.NET.Native/bin/${{ matrix.config }}/runtimes/**
          if-no-files-found: error

  packages:
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    needs:
      - natives
      - build-and-update
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: true
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download Debug Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: natives-Debug-*
          path: src/Raylib.NET.Native/bin/Debug/runtimes
          merge-multiple: true

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: natives-Release-*
          path: src/Raylib.NET.Native/bin/Release/runtimes
          merge-multiple: true

      - name: Generate NuGet Version
        run: |
          echo "VersionSuffix=build.$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Create NuGet Packages
        run: |
          dotnet pack src/Raylib.NET.Native -c Debug -o artifacts/nuget -p:SkipNatives=true -p:SkipGen=true
          dotnet pack src/Raylib.NET.Native -c Release -o artifacts/nuget -p:SkipNatives=true -p:SkipGen=true
          dotnet pack src/Raylib.NET -c Release -o artifacts/nuget -p:SkipNatives=true -p:SkipGen=true
          dotnet pack src/Raylib.NET.ImGui -c Release -o artifacts/nuget -p:SkipNatives=true -p:SkipGen=true

      - name: Upload NuGet Packages As Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/**

      - name: Publish NuGet Packages to GitHub Packages
        if: github.ref == 'refs/heads/master'
        run: dotnet nuget push "artifacts/nuget/*.nupkg" -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -k ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Login to NuGet.org
        if: github.ref == 'refs/heads/master'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: deathbeam

      - name: Publish NuGet Packages to NuGet.org
        if: github.ref == 'refs/heads/master'
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
